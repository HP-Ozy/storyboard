// one month as a 7-column grid of days; big = month view with the texts, otherwise just counts

  const el = document.createElement('div'), first = new Date(y, m, 1), today = ymd(new Date());

  el.title = t('heatOf', t('heat')[HEAT[m]]);

  for (let i = 0; i < 7; i++) g.append(Object.assign(document.createElement('small'), { textContent: new Date(2024, 0, 1 + i).toLocaleDateString(lang, { weekday: big ? 'short' : 'narrow' }) }));
  for (let i = (first.getDay() + 6) % 7; i > 0; i--) g.append(document.createElement('span'));
  for (let d = 1, n = new Date(y, m + 1, 0).getDate(); d <= n; d++) {
    const day = new Date(y, m, d), k = ymd(day), c = document.createElement('i');
    const stories = Object.keys(cal).filter(x => x.startsWith(`s ${k}`)).sort().flatMap(x => cal[x].map(n => `${x.slice(13)}:00 ${n}`));
    const flags = Object.keys(cal).filter(x => x.length > 10 && x.startsWith(k)).sort().flatMap(x => cal[x].filter(f => f.trim()).map(f => `${x.slice(11)}:00 ${f}`));
    const pubs = Object.keys(cal).filter(x => x.startsWith(`p ${k}`)).sort().flatMap(x => cal[x].map(v => [v.slice(0, 2), `${x.slice(13)}:00 ${chLabel(v)}`]));
    const em = (txt, st) => Object.assign(document.createElement('em'), { textContent: txt, className: st === 1 ? 'st' : st || '' });
    c.textContent = d;

    if (stories.length || flags.length || pubs.length) c.title = [...stories.map(n => '🎬 ' + n), ...pubs.map(p => p[1]), ...flags.map(f => '⚑ ' + f)].join('\n');
    if (big) c.append(...stories.map(n => em('🎬 ' + n, 1)), ...pubs.map(([p, txt]) => em(txt, p)), ...flags.map(f => em('⚑ ' + f)));

    if (Math.abs(b.x - a.x) < a.w + b.w && Math.abs(b.y - a.y) < a.h + b.h) return;
    const cx = (a.x + b.x) / 2 + (l.bx ?? 0), cy = (a.y + b.y) / 2 + (l.by ?? 0);
    const [x1, y1] = edge(a, cx - a.x, cy - a.y), [x2, y2] = edge(b, cx - b.x, cy - b.y);
    const d = `M${x1},${y1}Q${cx},${cy} ${x2},${y2}`, mx = (x1 + 2 * cx + x2) / 4, my = (y1 + 2 * cy + y2) / 4, on = sel?.l === l;

      (on ? `<circle data-h="tail" cx="${x1}" cy="${y1}" r="6"/><circle data-h="head" cx="${x2}" cy="${y2}" r="6"/><circle data-h="mid" cx="${mx}" cy="${my}" r="6"/><circle data-h="del" class="del" cx="${mx + 18}" cy="${my - 18}" r="7"><title>${t('delLink')}</title></circle>` : '') + '</g>';

links.onpointerdown = e => {

document.getElementById('botOff').onclick = () => api.slackSet('').then(botState).catch(fail);
const fail = err => { const m = /(bad\w+)(?::(.*))?$/.exec(err.message); alert(m ? t(m[1], m[2]) : err.message); };
const toFile = () => scenes.map(s => ({ ...s, links: s.links.map(l => ({ ...l, to: scenes.indexOf(l.to) })) }));
const fromFile = list => {
  const links = list.map((s, i) => s.links ? s.links.map(l => ({ ...l, to: list[l.to] })).filter(l => l.to) : list[i + 1] ? [{ to: list[i + 1] }] : []);
  list.forEach((s, i) => s.links = links[i]);
  return list;
};

let current = '';
const setCurrent = n => {
  current = n;
  const cur = document.getElementById('cur');
  cur.className = n ? 'on' : '';
  cur.textContent = n ? t('working', n) : t('newCur');
  document.title = n ? `${n} — Storyboard` : 'Storyboard';
};
const nameEl = document.getElementById('name');
const saveBtn = document.getElementById('save');
const discard = () => !dirty || confirm(t('unsaved'));
const load = ({ scenes: s, lib: l = {}, cal: c }) => { scenes = fromFile(s); mergeCal(c); lib = Object.fromEntries(LIBS.map(f => [f, l[f] ?? []])); sel = null; picked.clear(); dirty = false; render(); drawLib(); };

saveBtn.onclick = async () => {
  const name = nameEl.value.trim();
  if (!name) { alert(t('needName')); return nameEl.focus(); }
  try {
    const same = n => n.toLowerCase() === name.toLowerCase();
    if (!same(current) && (await api.list()).some(p => same(p.name)) && !confirm(t('exists', name))) return;
    await api.save(name, toFile(), lib);
    setCurrent(nameEl.value = name);
    dirty = false;
    saveBtn.textContent = t('saved');
    setTimeout(() => saveBtn.textContent = t('save'), 1500);
  } catch (e) { fail(e); }
};

document.getElementById('new').onclick = () => {
  if (discard()) { load({ scenes: [] }); setCurrent(nameEl.value = ''); }
};

async function showArchive() {
  const list = document.getElementById('list');
  const items = await api.list();
  document.getElementById('where').textContent = await api.folder();
  list.replaceChildren(items.length ? '' : t('empty'));
  for (const p of items) {
    const row = document.createElement('div');
    row.innerHTML = `<button></button><span></span><button>${t('del')}</button>`;
    if (p.name === current) row.className = 'cur';
    const [open, info, del] = row.children;
    open.textContent = p.name;
    info.textContent = `${t('count', p.scenes)} · ${new Date(p.date).toLocaleString(lang)}`;
    open.onclick = () => { if (discard()) api.load(p.name).then(s => { load(s); setCurrent(nameEl.value = p.name); archive.close(); }).catch(fail); };
    del.onclick = () => {
      if (!confirm(t('delAsk', p.name)) || !confirm(t('delAsk2', p.name))) return;
      api.remove(p.name).then(() => { if (p.name === current) { setCurrent(''); dirty = true; } showArchive(); }).catch(fail);
    };
    list.append(row);
  }
  if (!archive.open) archive.showModal();
}
document.getElementById('arch').onclick = () => showArchive().catch(fail);

function preparePrint() {
  board.style.zoom = '';
  const els = [...board.querySelectorAll('.scene')];
  if (!els.length) return null;
  const tas = [...board.querySelectorAll('textarea')];
  const hs = tas.map(t => t.style.height);
  tas.forEach(t => t.style.height = t.scrollHeight + 'px');
  sel = null;
  drawLinks();
  const pad = 30;
  const x0 = Math.min(...els.map(e => e.offsetLeft)) - pad, y0 = Math.min(...els.map(e => e.offsetTop)) - pad;
  const w = Math.ceil(Math.max(...els.map(e => e.offsetLeft + e.offsetWidth)) - x0 + pad);
  const h = Math.ceil(Math.max(...els.map(e => e.offsetTop + e.offsetHeight)) - y0 + pad);
  const vars = { '--w': w + 'px', '--h': h + 'px', '--tx': -x0 + 'px', '--ty': -y0 + 'px' };
  for (const v in vars) board.style.setProperty(v, vars[v]);
  return { w, h, undo: () => { tas.forEach((t, i) => t.style.height = hs[i]); board.removeAttribute('style'); board.style.zoom = scale; drawLinks(); } };
}

const payload = () => JSON.stringify({ name: nameEl.value.trim() || current, scenes: toFile(), lib });
document.getElementById('exp').onclick = () => api.exportFile(nameEl.value.trim() || current, payload()).catch(fail);

document.getElementById('pdf').onclick = () => {
  const page = preparePrint();
  if (!page) return alert(t('noScenes'));
  api.pdf(page.w, page.h, payload()).catch(fail).finally(page.undo);
};

ondragover = e => { if (!e.dataTransfer.types.includes('Files')) return; e.preventDefault(); document.body.classList.add('drop'); };
ondragleave = e => { if (!e.relatedTarget) document.body.classList.remove('drop'); };
ondrop = async e => {
  e.preventDefault();
  document.body.classList.remove('drop');
  const f = e.dataTransfer.files[0];
  if (!f) return;
  const text = await f.text();
  const at = text.lastIndexOf('\n%STORYBOARD ');
  const json = f.name.endsWith('.storyboard') ? text : at < 0 ? null : text.slice(at + 13);
  if (!json) { alert(t('oldPdf')); return showArchive().catch(fail); }
  if (!discard()) return;
  try {
    const p = JSON.parse(json);
    const saved = p.name && (await api.list()).some(x => x.name === p.name);
    load(saved ? await api.load(p.name) : p);
    setCurrent(saved ? p.name : '');
    nameEl.value = p.name ?? '';
    dirty = !saved;
  } catch (err) { fail(err); }
};

document.getElementById('lang').onchange = e => { lang = e.target.value; try { localStorage.lang = lang; } catch {} applyLang(); };
applyLang();
api.calGet().then(c => { cal = { ...fixCal(c), ...cal }; if (calendar.open) drawCal(); }).catch(fail);
onbeforeunload = () => { if (calTimer) flushCal(); return dirty ? true : undefined; };
</script>
