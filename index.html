<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Storyboard</title>
<style>
  html { scrollbar-width: none; }
  body { margin: 0; background: #1c1d21 radial-gradient(#2e3036 1px, transparent 1px) 0 0 / 24px 24px; color: #e6e6e6; font: 14px system-ui; }
  header { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 2; padding: 8px; background: #26282de6; border: 1px solid #34363c; border-radius: 14px; box-shadow: 0 4px 16px #0006; backdrop-filter: blur(6px); display: flex; gap: 8px; white-space: nowrap; }
  #board { position: relative; width: 6000px; height: 4000px; cursor: grab; }
  #board.pan { cursor: grabbing; }
  #links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #links .hit { fill: none; stroke: transparent; stroke-width: 14; pointer-events: stroke; cursor: pointer; }
  #links circle { fill: #4af; pointer-events: all; cursor: move; }
  #links circle.del { fill: #d33; cursor: pointer; }
  .scene { position: absolute; width: 260px; display: flex; flex-direction: column; gap: 6px; background: transparent; cursor: grab; user-select: none; }
  .scene img { width: 100%; border: 1px solid #333; border-radius: 8px; pointer-events: none; }
  .scene textarea { background: #25272c; color: #e6e6e6; border: 1px solid #3a3c42; min-height: 60px; resize: vertical; cursor: text; border-radius: 8px; padding: 6px; }
  .tools { display: flex; gap: 4px; }
  .sound { display: flex; flex-direction: column; gap: 4px; padding: 6px; border: 1px solid #2a3a4a; border-radius: 8px; background: #0b1520; }
  .sound textarea { min-height: 40px; }
  .sound audio { width: 100%; height: 32px; }
  .sound div { display: flex; gap: 4px; }
  button, label { background: #222; color: #eee; border: 1px solid #444; padding: 5px 12px; cursor: pointer; border-radius: 8px; }
  button:hover, label:hover { background: #2c2c2c; }
  input[type=file] { display: none; }
  dialog { background: #111; color: #eee; border: 1px solid #444; min-width: 480px; border-radius: 14px; padding: 18px; }
  dialog::backdrop { background: #0008; }
  #list { display: flex; flex-direction: column; gap: 4px; margin: 10px 0; max-height: 60vh; overflow: auto; scrollbar-width: thin; scrollbar-color: #44474e transparent; }
  #list div { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; }
  #list button:first-child { text-align: left; }
  #name { background: #222; color: #eee; border: 1px solid #444; padding: 5px 10px; border-radius: 8px; }
  #cur { margin-left: 8px; align-self: center; padding: 4px 14px; border-radius: 999px; background: #222; color: #999; border: 1px solid #333; }
  #cur.on { background: #12263a; color: #cfe6ff; border-color: #2a5a8a; }
  #cur.on::before { content: '●'; color: #4af; margin-right: 8px; }
  #list .cur button:first-child { border-color: #4af; color: #cfe6ff; }
  #where { color: #888; }
  body.drop::after { content: 'Rilascia il file per aprire il progetto'; position: fixed; inset: 12px; z-index: 9; display: grid; place-items: center; border: 3px dashed #4af; border-radius: 14px; background: #0a1a2acc; color: #cfe6ff; font-size: 22px; pointer-events: none; }
  .story { display: flex; flex-wrap: wrap; gap: 4px; }
  .story button { padding: 2px 8px; font-size: 12px; border-radius: 999px; background: #263026; border-color: #3f5a3f; color: #cfe8c0; }
  .story button::after { content: ' ×'; opacity: .6; }
  .story select { background: #25272c; color: #aaa; border: 1px dashed #44474e; border-radius: 999px; padding: 2px 8px; font-size: 12px; }
  #story { position: fixed; right: 12px; bottom: 12px; z-index: 2; width: 270px; padding: 8px 12px; background: #26282de6; border: 1px solid #34363c; border-radius: 14px; box-shadow: 0 4px 16px #0006; backdrop-filter: blur(6px); }
  #story summary { cursor: pointer; font-weight: 600; }
  #story.done summary { color: #8fd88f; }
  #story ol { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 4px; }
  #story li { color: #888; }
  #story li::before { content: '☐ '; }
  #story li.ok { color: #e6e6e6; }
  #story li.ok::before { content: '✓ '; color: #8fd88f; }
  #story small { display: block; margin-left: 1.4em; color: #777; }
  @media print {
    #story, .story select, .story button::after { display: none; }
    .story button { background: #fff; color: #000; border-color: #999; }
    body, .scene { background: #fff; color: #000; overflow: hidden; }
    header { display: none; }
    .tools, .sound audio, .sound div { display: none; }
    .sound { background: #fff; border-color: #999; }
    .sound:has(.snd:placeholder-shown):not(:has(audio[src])) { display: none; }
    .sound:has(audio[src])::after { content: 'Traccia musicale allegata'; font-style: italic; }
    .scene textarea { background: #fff; color: #000; resize: none; overflow: hidden; }
    #board { transform-origin: 0 0; width: var(--w); height: var(--h); transform: translate(var(--tx), var(--ty)); }
    #links { overflow: visible; }
  }
</style>
<header>
  <label>+ Immagini<input id="add" type="file" accept="image/*" multiple></label>
  <input id="name" placeholder="Nome progetto">
  <button id="save">Salva</button>
  <button id="new">Nuovo</button>
  <button id="arch">Archivio</button>
  <button id="exp">Esporta .storyboard</button>
  <button id="pdf">Esporta PDF per IA</button>
  <span id="cur">Nuovo progetto · non salvato</span>
</header>
<dialog id="archive"><b>Archivio progetti</b><div><small id="where"></small></div><div id="list"></div><button onclick="archive.close()">Chiudi</button></dialog>
<details id="story" open><summary></summary><ol></ol></details>
<div id="board">
  <svg id="links"><defs><marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#888"/></marker></defs><g></g></svg>
</div>
<script>
const STORY = [
  ['Protagonista', 'Personaggio che guida la storia', 'Chi stiamo seguendo?'],
  ['Obiettivo', 'Ciò che il protagonista vuole ottenere', 'Che cosa desidera?'],
  ['Motivazione', 'Ragione per cui desidera qualcosa', 'Perché lo vuole?'],
  ['Conflitto', "Ostacoli che impediscono di raggiungere l'obiettivo", 'Cosa glielo impedisce?'],
  ['Antagonista', 'Forza che si oppone al protagonista', 'Chi o cosa gli si oppone?'],
  ['Posta in gioco', 'Conseguenze del successo o del fallimento', 'Che cosa rischia di perdere?'],
  ['Ambientazione', 'Mondo, epoca e regole in cui avvengono gli eventi', 'Dove e quando accade?'],
  ['Arco di trasformazione', 'Evoluzione psicologica o morale del personaggio', 'Come cambia?'],
  ['Tema', 'Idea profonda esplorata dalla storia', 'Di cosa parla veramente?'],
  ['Risoluzione', 'Conseguenza finale delle scelte e dei conflitti', 'Come si conclude?'],
];
function drawStory() {
  const used = new Set(scenes.flatMap(s => s.tags));
  const panel = document.getElementById('story');
  panel.classList.toggle('done', used.size === STORY.length);
  panel.querySelector('summary').textContent = used.size === STORY.length ? 'Storia coerente e comprensibile ✓' : `Elementi narrativi ${used.size}/${STORY.length}`;
  panel.querySelector('ol').innerHTML = STORY.map(([n, f, q], k) => `<li class="${used.has(k) ? 'ok' : ''}" title="${f}"><b>${n}</b><small>${q}</small></li>`).join('');
}

let scenes = [];
let dirty = false;
const board = document.getElementById('board');
const links = document.querySelector('#links g');

let sel = null;
const box = s => { const el = board.querySelectorAll('.scene')[scenes.indexOf(s)]; return { x: el.offsetLeft + el.offsetWidth / 2, y: el.offsetTop + el.offsetHeight / 2, w: el.offsetWidth / 2 + 6, h: el.offsetHeight / 2 + 6 }; };
const pt = e => { const r = board.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
const sceneAt = e => scenes[document.elementsFromPoint(e.clientX, e.clientY).find(x => x.classList.contains('scene'))?.dataset.i];
const canLink = (a, b) => a && b && a !== b && !a.links.some(l => l.to === b);
const drag = (move, up) => { onpointermove = move; onpointerup = e => { onpointermove = onpointerup = null; up(e); }; };
const unlink = () => { sel.s.links.splice(sel.s.links.indexOf(sel.l), 1); sel = null; dirty = true; drawLinks(); };

function drawLinks(tmp) {
  const edge = (b, dx, dy) => { const t = Math.min(b.w / Math.abs(dx), b.h / Math.abs(dy)); return [b.x + dx * t, b.y + dy * t]; };
  let html = '';
  scenes.forEach((s, i) => s.links.forEach((l, j) => {
    const a = box(s), b = box(l.to);
    if (Math.abs(b.x - a.x) < a.w + b.w && Math.abs(b.y - a.y) < a.h + b.h) return;
    const cx = (a.x + b.x) / 2 + (l.bx ?? 0), cy = (a.y + b.y) / 2 + (l.by ?? 0);
    const [x1, y1] = edge(a, cx - a.x, cy - a.y), [x2, y2] = edge(b, cx - b.x, cy - b.y);
    const d = `M${x1},${y1}Q${cx},${cy} ${x2},${y2}`, mx = (x1 + 2 * cx + x2) / 4, my = (y1 + 2 * cy + y2) / 4, on = sel?.l === l;
    html += `<g data-link="${i},${j}"><path class="hit" d="${d}"/><path d="${d}" fill="none" stroke="${on ? '#4af' : '#888'}" stroke-width="2" marker-end="url(#arr)"/>` +
      (on ? `<circle data-h="tail" cx="${x1}" cy="${y1}" r="6"/><circle data-h="head" cx="${x2}" cy="${y2}" r="6"/><circle data-h="mid" cx="${mx}" cy="${my}" r="6"/><circle data-h="del" class="del" cx="${mx + 18}" cy="${my - 18}" r="7"><title>Elimina freccia</title></circle>` : '') + '</g>';
  }));
  if (tmp) html += `<line x1="${tmp[0]}" y1="${tmp[1]}" x2="${tmp[2]}" y2="${tmp[3]}" stroke="#4af" stroke-width="2" stroke-dasharray="6 4"/>`;
  links.innerHTML = html;
}

links.onpointerdown = e => {
  e.stopPropagation();
  const [i, j] = e.target.closest('[data-link]').dataset.link.split(',');
  const s = scenes[i], l = s.links[j], h = e.target.dataset.h;
  if (h === 'del') return unlink();
  sel = { s, l };
  drawLinks();
  if (!h) return;
  let p = pt(e);
  drag(m => {
    const q = pt(m);
    if (h === 'mid') { l.bx = (l.bx ?? 0) + 2 * (q.x - p.x); l.by = (l.by ?? 0) + 2 * (q.y - p.y); p = q; dirty = true; return drawLinks(); }
    const o = box(h === 'head' ? s : l.to);
    drawLinks([o.x, o.y, q.x, q.y]);
  }, u => {
    const t = sceneAt(u);
    if (h === 'head' && canLink(s, t)) { l.to = t; dirty = true; }
    if (h === 'tail' && canLink(t, l.to)) { s.links.splice(s.links.indexOf(l), 1); t.links.push(l); sel.s = t; dirty = true; }
    drawLinks();
  });
};
board.onpointerdown = e => {
  if (sel) { sel = null; drawLinks(); }
  if (e.target !== board) return;
  board.setPointerCapture(e.pointerId);
  board.classList.add('pan');
  board.onpointermove = m => scrollBy(-m.movementX, -m.movementY);
  board.onpointerup = () => { board.onpointermove = null; board.classList.remove('pan'); };
};
onkeydown = e => { if (sel && e.key === 'Delete' && !e.target.closest('textarea, input')) unlink(); };

function render() {
  board.querySelectorAll('.scene').forEach(e => e.remove());
  scenes.forEach((s, i) => {
    s.x ??= 20 + (i % 5) * 300;
    s.y ??= 20 + Math.floor(i / 5) * 360;
    const el = document.createElement('div');
    el.className = 'scene';
    el.style.left = s.x + 'px';
    el.style.top = s.y + 'px';
    el.dataset.i = i;
    el.innerHTML = `<b>Scena ${i + 1}</b><img><textarea placeholder="Commento..."></textarea>
      <div class="story"></div>
      <div class="sound"><b>🎵 Audio</b><textarea class="snd" placeholder="Genere, atmosfera, effetti sonori..."></textarea><audio controls></audio>
        <div><label>Allega traccia<input type="file" accept="audio/*"></label><button data-r title="Rimuovi traccia">✕</button></div></div>
      <div class="tools"><button data-m="-1">◀</button><button data-m="1">▶</button><button data-a title="Trascina su un'altra scena per collegarla">↗</button><button data-d>✕</button></div>`;
    el.querySelector('img').src = s.img;
    el.querySelector('img').onload = () => drawLinks();
    const snd = el.querySelector('.snd'), au = el.querySelector('audio'), rm = el.querySelector('[data-r]');
    snd.value = s.sound ?? '';
    snd.oninput = () => { s.sound = snd.value; dirty = true; };
    if (s.audio) au.src = s.audio;
    au.hidden = rm.hidden = !s.audio;
    el.querySelector('.sound input').onchange = async e => { s.audio = await readAs(e.target.files[0], 'readAsDataURL'); dirty = true; render(); };
    rm.onclick = () => { delete s.audio; dirty = true; render(); };
    s.tags ??= [];
    const story = el.querySelector('.story');
    story.innerHTML = s.tags.map(k => `<button data-t="${k}" title="${STORY[k][2]}">${STORY[k][0]}</button>`).join('') +
      `<select><option value="">+ Elemento narrativo</option>${STORY.map(([n], k) => s.tags.includes(k) ? '' : `<option value="${k}">${n}</option>`).join('')}</select>`;
    story.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { s.tags = s.tags.filter(k => k !== +b.dataset.t); dirty = true; render(); });
    story.querySelector('select').onchange = e => { s.tags = [...s.tags, +e.target.value].sort((a, b) => a - b); dirty = true; render(); };
    const ta = el.querySelector('textarea');
    ta.value = s.text;
    ta.oninput = () => { s.text = ta.value; dirty = true; };
    new ResizeObserver(() => drawLinks()).observe(el);
    el.querySelector('[data-a]').onpointerdown = e => {
      e.stopPropagation();
      drag(m => { const a = box(s), q = pt(m); drawLinks([a.x, a.y, q.x, q.y]); },
        u => { const t = sceneAt(u); if (canLink(s, t)) { s.links.push({ to: t }); dirty = true; } drawLinks(); });
    };
    el.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
      const j = i + +b.dataset.m;
      if (j < 0 || j >= scenes.length) return;
      [scenes[i], scenes[j]] = [scenes[j], scenes[i]];
      dirty = true;
      render();
    });
    el.querySelector('[data-d]').onclick = () => { scenes.splice(i, 1); scenes.forEach(o => o.links = o.links.filter(l => l.to !== s)); sel = null; dirty = true; render(); };
    el.onpointerdown = e => {
      if (e.target.closest('textarea, button, label, audio, select')) return;
      const dx = e.clientX - s.x, dy = e.clientY - s.y;
      el.setPointerCapture(e.pointerId);
      el.style.zIndex = 1;
      el.onpointermove = m => {
        s.x = Math.max(0, m.clientX - dx);
        s.y = Math.max(0, m.clientY - dy);
        el.style.left = s.x + 'px';
        el.style.top = s.y + 'px';
        dirty = true;
        drawLinks();
      };
      el.onpointerup = () => { el.onpointermove = null; el.style.zIndex = ''; };
    };
    board.append(el);
  });
  drawLinks();
  drawStory();
}

const readAs = (f, how) => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr[how](f); });

document.getElementById('add').onchange = async e => {
  const files = [...e.target.files].sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
  for (const f of files) {
    const s = { img: await readAs(f, 'readAsDataURL'), text: '', sound: '', links: [] };
    scenes.at(-1)?.links.push({ to: s });
    scenes.push(s);
  }
  e.target.value = '';
  dirty = true;
  render();
};

const fail = err => alert(err.message);
const toFile = () => scenes.map(s => ({ ...s, links: s.links.map(l => ({ ...l, to: scenes.indexOf(l.to) })) }));
const fromFile = list => {
  const links = list.map((s, i) => s.links ? s.links.map(l => ({ ...l, to: list[l.to] })).filter(l => l.to) : list[i + 1] ? [{ to: list[i + 1] }] : []);
  list.forEach((s, i) => s.links = links[i]);
  return list;
};

let current = '';
const setCurrent = n => {
  current = n;
  const cur = document.getElementById('cur');
  cur.className = n ? 'on' : '';
  cur.textContent = n ? `Stai lavorando su: ${n}` : 'Nuovo progetto · non salvato';
  document.title = n ? `${n} — Storyboard` : 'Storyboard';
};
const nameEl = document.getElementById('name');
const saveBtn = document.getElementById('save');
const discard = () => !dirty || confirm('Ci sono modifiche non salvate. Continuare?');
const load = s => { scenes = fromFile(s); sel = null; dirty = false; render(); };

saveBtn.onclick = async () => {
  const name = nameEl.value.trim();
  if (!name) { alert('Scrivi il nome del progetto.'); return nameEl.focus(); }
  try {
    const same = n => n.toLowerCase() === name.toLowerCase();
    if (!same(current) && (await api.list()).some(p => same(p.name)) && !confirm(`"${name}" esiste già nell'archivio. Sovrascrivere?`)) return;
    await api.save(name, toFile());
    setCurrent(nameEl.value = name);
    dirty = false;
    saveBtn.textContent = 'Salvato ✓';
    setTimeout(() => saveBtn.textContent = 'Salva', 1500);
  } catch (e) { fail(e); }
};

document.getElementById('new').onclick = () => {
  if (discard()) { load([]); setCurrent(nameEl.value = ''); }
};

async function showArchive() {
  const list = document.getElementById('list');
  const items = await api.list();
  document.getElementById('where').textContent = await api.folder();
  list.replaceChildren(items.length ? '' : 'Nessun progetto salvato.');
  for (const p of items) {
    const row = document.createElement('div');
    row.innerHTML = '<button></button><span></span><button>Elimina</button>';
    if (p.name === current) row.className = 'cur';
    const [open, info, del] = row.children;
    open.textContent = p.name;
    info.textContent = `${p.scenes} scene · ${new Date(p.date).toLocaleString()}`;
    open.onclick = () => { if (discard()) api.load(p.name).then(s => { load(s); setCurrent(nameEl.value = p.name); archive.close(); }).catch(fail); };
    del.onclick = () => {
      if (!confirm(`Eliminare definitivamente "${p.name}"?`)) return;
      api.remove(p.name).then(() => { if (p.name === current) { setCurrent(''); dirty = true; } showArchive(); }).catch(fail);
    };
    list.append(row);
  }
  if (!archive.open) archive.showModal();
}
document.getElementById('arch').onclick = () => showArchive().catch(fail);

function preparePrint() {
  const els = [...board.querySelectorAll('.scene')];
  if (!els.length) return null;
  const tas = [...board.querySelectorAll('textarea')];
  const hs = tas.map(t => t.style.height);
  tas.forEach(t => t.style.height = t.scrollHeight + 'px');
  sel = null;
  drawLinks();
  const pad = 30;
  const x0 = Math.min(...els.map(e => e.offsetLeft)) - pad, y0 = Math.min(...els.map(e => e.offsetTop)) - pad;
  const w = Math.ceil(Math.max(...els.map(e => e.offsetLeft + e.offsetWidth)) - x0 + pad);
  const h = Math.ceil(Math.max(...els.map(e => e.offsetTop + e.offsetHeight)) - y0 + pad);
  const vars = { '--w': w + 'px', '--h': h + 'px', '--tx': -x0 + 'px', '--ty': -y0 + 'px' };
  for (const v in vars) board.style.setProperty(v, vars[v]);
  return { w, h, undo: () => { tas.forEach((t, i) => t.style.height = hs[i]); board.removeAttribute('style'); drawLinks(); } };
}

const payload = () => JSON.stringify({ name: nameEl.value.trim() || current, scenes: toFile() });
document.getElementById('exp').onclick = () => api.exportFile(nameEl.value.trim() || current, payload()).catch(fail);

document.getElementById('pdf').onclick = () => {
  const page = preparePrint();
  if (!page) return alert('Nessuna scena da esportare.');
  api.pdf(page.w, page.h, payload()).catch(fail).finally(page.undo);
};

ondragover = e => { e.preventDefault(); document.body.classList.add('drop'); };
ondragleave = e => { if (!e.relatedTarget) document.body.classList.remove('drop'); };
ondrop = async e => {
  e.preventDefault();
  document.body.classList.remove('drop');
  const f = e.dataTransfer.files[0];
  if (!f) return;
  const text = await f.text();
  const at = text.lastIndexOf('\n%STORYBOARD ');
  const json = f.name.endsWith('.storyboard') ? text : at < 0 ? null : text.slice(at + 13);
  if (!json) { alert('Questo PDF è stato esportato con una versione precedente e contiene solo il disegno, non i dati del progetto. Scegli il progetto dall\'archivio e riesportalo.'); return showArchive().catch(fail); }
  if (!discard()) return;
  try {
    const p = JSON.parse(json);
    const saved = p.name && (await api.list()).some(x => x.name === p.name);
    load(saved ? await api.load(p.name) : p.scenes);
    setCurrent(saved ? p.name : '');
    nameEl.value = p.name ?? '';
    dirty = !saved;
  } catch (err) { fail(err); }
};

drawStory();
onbeforeunload = () => dirty ? true : undefined;
</script>
